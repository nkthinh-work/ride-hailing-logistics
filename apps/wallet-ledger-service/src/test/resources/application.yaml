spring:
  datasource:
    url: jdbc:h2:mem:rhl_wallet;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

security:
  jwt:
    issuer: rhl-identity
    public-key-location: classpath:keys/public.pem
  internal:
    secret: test-internal-secret

wallet:
  default-currency: VND
  commission:
    policy-status: COMMISSION_POLICY_PENDING
  settlement:
    policy-status: SETTLEMENT_POLICY_PENDING

kafka:
  enabled: false
