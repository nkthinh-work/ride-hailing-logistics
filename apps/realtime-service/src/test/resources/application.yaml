server:
  port: 0

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: realtime-service-test

security:
  jwt:
    issuer: rhl-identity
    public-key-location: classpath:keys/public.pem

app:
  internal-secret: rhl-internal-secret-2026
  stomp:
    relay-enabled: false
    allowed-origin-patterns: "*"
    session-inactivity-timeout-ms: 300000

realtime:
  kafka:
    enabled: false
