info:
  name: get-pending-offer
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/offers/pending"
  headers: []
  auth:
    type: bearer
    token: "{{driverAccessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK or 404 NOT_FOUND", function() {
          expect(res.status).to.be.oneOf([200, 404]);
        });
        if (res.status === 200) {
          test("Returns pending offer for authenticated driver", function() {
            expect(res.body.status).to.equal("PENDING");
            bru.setEnvVar("offerId", res.body.id);
          });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
