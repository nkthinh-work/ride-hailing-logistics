info:
  name: location-telemetry-duplicate-seq-409
  type: http
  seq: 13

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/locations/me"
  body:
    type: json
    data: |-
      {
        "longitude": 105.8342,
        "latitude": 21.0278,
        "sequenceNumber": 100
      }
  auth:
    type: bearer
    token: "{{driverToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 409 Conflict", function() {
          expect(res.status).to.equal(409);
        });
        test("Error code indicates duplicate telemetry", function() {
          expect(res.body).to.have.property("code");
          expect(["DUPLICATE_TELEMETRY", "OUT_OF_ORDER_TELEMETRY"]).to.include(res.body.code);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
