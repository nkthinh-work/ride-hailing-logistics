info:
  name: auth-register-validation-error-400
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "invalid-email-format",
        "password": ""
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 400 Bad Request", function() {
          expect(res.status).to.equal(400);
        });
        test("Error code indicates validation failure", function() {
          expect(res.body).to.have.property("code");
          expect(["VALIDATION_ERROR", "BAD_REQUEST"]).to.include(res.body.code);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
