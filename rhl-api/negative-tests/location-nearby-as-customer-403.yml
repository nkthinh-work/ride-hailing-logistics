info:
  name: location-nearby-as-customer-403
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/v1/locations/nearby?longitude=105.8342&latitude=21.0278&radiusKm=3&limit=10"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 403 Forbidden", function() {
          expect(res.status).to.equal(403);
        });
        test("Error code indicates access denied", function() {
          expect(res.body).to.have.property("code");
          expect(["ACCESS_DENIED", "FORBIDDEN"]).to.include(res.body.code);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
