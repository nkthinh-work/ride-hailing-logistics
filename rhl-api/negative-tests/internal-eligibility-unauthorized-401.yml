info:
  name: internal-eligibility-unauthorized-401
  type: http
  seq: 7

http:
  method: GET
  url: "{{identityBaseUrl}}/internal/v1/drivers/{{applicationId}}/eligibility"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 401 Unauthorized", function() {
          expect(res.status).to.equal(401);
        });
        test("Error code indicates unauthorized internal service", function() {
          expect(res.body).to.have.property("code");
          expect(res.body.code).to.equal("UNAUTHORIZED_INTERNAL_SERVICE");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
