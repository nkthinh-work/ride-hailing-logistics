info:
  name: driver-apply-validation-error-400
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/drivers/applications"
  body:
    type: json
    data: |-
      {}
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 400 Bad Request", function() {
          expect(res.status).to.equal(400);
        });
        test("Error code is VALIDATION_ERROR", function() {
          expect(res.body).to.have.property("code");
          expect(["VALIDATION_ERROR", "BAD_REQUEST"]).to.include(res.body.code);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
