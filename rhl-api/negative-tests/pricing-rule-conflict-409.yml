info:
  name: pricing-rule-conflict-409
  type: http
  seq: 16

http:
  method: POST
  url: "{{pricingBaseUrl}}/api/v1/admin/pricing-rules"
  headers:
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{adminToken}}"
  body:
    type: json
    data: |-
      {
        "serviceType": "RIDE",
        "vehicleType": "MOTORBIKE",
        "regionId": "DEFAULT",
        "baseFare": 13000,
        "includedDistanceKm": 2.0,
        "pricePerKm": 5000,
        "pricePerMinute": 450,
        "minimumFare": 13000,
        "currency": "VND",
        "effectiveFrom": "2026-11-05T00:00:00Z",
        "reason": "Overlapping conflicting rule"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 409 Conflict", function() {
          expect(res.status).to.equal(409);
        });
        test("Error code indicates pricing rule conflict", function() {
          expect(res.body).to.have.property("code");
          expect(res.body.code).to.equal("PRICING_RULE_CONFLICT");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
