info:
  name: location-telemetry-stale-timestamp-400
  type: http
  seq: 10

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/locations/me"
  body:
    type: json
    data: |-
      {
        "longitude": 105.8342,
        "latitude": 21.0278,
        "deviceTimestamp": "2020-01-01T00:00:00Z",
        "accuracyMeters": 10.0
      }
  auth:
    type: bearer
    token: "{{driverToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 400 Bad Request", function() {
          expect(res.status).to.equal(400);
        });
        test("Error code indicates stale telemetry", function() {
          expect(res.body).to.have.property("code");
          expect(["TELEMETRY_DATA_TOO_OLD", "INVALID_PARAMETER"]).to.include(res.body.code);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
