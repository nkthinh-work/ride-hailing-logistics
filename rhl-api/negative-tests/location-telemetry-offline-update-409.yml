info:
  name: location-telemetry-offline-update-409
  type: http
  seq: 14

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/locations/me"
  body:
    type: json
    data: |-
      {
        "longitude": 105.8342,
        "latitude": 21.0278
      }
  auth:
    type: bearer
    token: "{{driverToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 409 Conflict", function() {
          expect(res.status).to.equal(409);
        });
        test("Error code indicates driver offline", function() {
          expect(res.body).to.have.property("code");
          expect(res.body.code).to.equal("DRIVER_OFFLINE");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
