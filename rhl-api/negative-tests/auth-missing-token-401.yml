info:
  name: auth-missing-token-401
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/auth/me"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 401 Unauthorized", function() {
          expect(res.status).to.equal(401);
        });
        test("Error code is TOKEN_MISSING", function() {
          expect(res.body).to.have.property("code");
          expect(res.body.code).to.equal("TOKEN_MISSING");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
