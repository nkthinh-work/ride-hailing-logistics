info:
  name: auth-invalid-token-401
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/auth/me"
  auth:
    type: bearer
    token: invalid.jwt.token

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 401 Unauthorized", function() {
          expect(res.status).to.equal(401);
        });
        test("Error code indicates invalid token", function() {
          expect(res.body).to.have.property("code");
          expect(["INVALID_TOKEN", "UNAUTHORIZED"]).to.include(res.body.code);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
