info:
  name: location-telemetry-invalid-coords-400
  type: http
  seq: 9

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/locations/me"
  body:
    type: json
    data: |-
      {
        "longitude": 105.8342,
        "latitude": 95.0
      }
  auth:
    type: bearer
    token: "{{driverToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 400 Bad Request", function() {
          expect(res.status).to.equal(400);
        });
        test("Error code indicates invalid parameter", function() {
          expect(res.body).to.have.property("code");
          expect(["INVALID_PARAMETER", "VALIDATION_ERROR"]).to.include(res.body.code);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
