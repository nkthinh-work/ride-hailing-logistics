info:
  name: 01-customer-initiate-cash-payment
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/payments"
  headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: "idemp-cash-manual-001"
  auth:
    type: bearer
    token: "{{accessToken}}"
  body:
    type: json
    data: |-
      {
        "tripId": "{{paymentTripId}}",
        "paymentMethod": "CASH"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 or 201", function() {
          expect([200, 201]).to.include(res.status);
        });
        test("Payment status is PENDING and method is CASH", function() {
          expect(res.body.paymentMethod).to.equal("CASH");
          expect(res.body.status).to.equal("PENDING");
          if (res.body.paymentId) {
            bru.setEnvVar("paymentId", res.body.paymentId);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
