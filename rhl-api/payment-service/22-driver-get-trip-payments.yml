info:
  name: 22-driver-get-trip-payments
  type: http
  seq: 22

http:
  method: GET
  url: "{{baseUrl}}/api/v1/payments/driver/trips/{{tripId}}"
  auth:
    type: bearer
    token: "{{driverToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.status).to.equal(200);
        });
        test("Returns array of payments for the completed trip", function() {
          expect(Array.isArray(res.body)).to.be.true;
          if (res.body.length > 0) {
            expect(res.body[0].tripId).to.equal(bru.getEnvVar("tripId"));
            bru.setEnvVar("paymentId", res.body[0].paymentId);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
