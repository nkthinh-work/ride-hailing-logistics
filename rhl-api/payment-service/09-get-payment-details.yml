info:
  name: 09-get-payment-details
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/api/v1/payments/{{paymentId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.status).to.equal(200);
        });
        test("Payment details returned with attempts collection", function() {
          expect(res.body.paymentId).to.equal(bru.getEnvVar("paymentId"));
          expect(res.body.amount).to.be.a("number");
          expect(res.body.currency).to.equal("VND");
          expect(res.body.attempts).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
