info:
  name: 15-customer-duplicate-refund-idempotent
  type: http
  seq: 15

http:
  method: POST
  url: "{{baseUrl}}/api/v1/payments/{{paymentId}}/refunds"
  headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: "idemp-refund-001"
  auth:
    type: bearer
    token: "{{accessToken}}"
  body:
    type: json
    data: |-
      {
        "amount": 25000,
        "reason": "Driver arrived late and cancelled trip"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 or 201 (Idempotent replay)", function() {
          expect([200, 201]).to.include(res.status);
        });
        test("Returns original refund record without duplicating", function() {
          expect(res.body.refundId).to.equal(bru.getEnvVar("refundId"));
          expect(res.body.refundAmount).to.equal(25000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
