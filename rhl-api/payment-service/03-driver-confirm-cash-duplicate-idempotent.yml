info:
  name: 03-driver-confirm-cash-duplicate-idempotent
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/payments/{{paymentId}}/cash/confirm"
  auth:
    type: bearer
    token: "{{driverToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK (Idempotent replay)", function() {
          expect(res.status).to.equal(200);
        });
        test("Payment remains SUCCEEDED without duplication", function() {
          expect(res.body.paymentId).to.equal(bru.getEnvVar("paymentId"));
          expect(res.body.status).to.equal("SUCCEEDED");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
