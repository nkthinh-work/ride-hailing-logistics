info:
  name: get-pricing-rule-by-id
  type: http
  seq: 3

http:
  method: GET
  url: "{{pricingBaseUrl}}/api/v1/admin/pricing-rules/{{pricingRuleId}}"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.status).to.equal(200);
        });
        test("Returns matching pricing rule", function() {
          expect(res.body).to.have.property("id");
          expect(res.body.id).to.equal(bru.getEnvVar("pricingRuleId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
