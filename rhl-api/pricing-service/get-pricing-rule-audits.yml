info:
  name: get-pricing-rule-audits
  type: http
  seq: 4

http:
  method: GET
  url: "{{pricingBaseUrl}}/api/v1/admin/pricing-rules/{{pricingRuleId}}/audits"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.status).to.equal(200);
        });
        test("Returns audit trail history", function() {
          expect(Array.isArray(res.body)).to.be.true;
          expect(res.body.length).to.be.at.least(1);
          expect(res.body[0]).to.have.property("action");
          expect(res.body[0]).to.have.property("actorId");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
