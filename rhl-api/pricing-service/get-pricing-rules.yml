info:
  name: get-pricing-rules
  type: http
  seq: 2

http:
  method: GET
  url: "{{pricingBaseUrl}}/api/v1/admin/pricing-rules?serviceType=RIDE&vehicleType=MOTORBIKE"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.status).to.equal(200);
        });
        test("Returns array of pricing rules", function() {
          expect(Array.isArray(res.body)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
