info:
  name: create-fare-quote
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v1/fares/quote"
  headers:
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{accessToken}}"
  body:
    type: json
    data: |-
      {
        "serviceType": "RIDE",
        "vehicleType": "MOTORBIKE",
        "regionId": "DEFAULT",
        "pickupLatitude": 10.7769,
        "pickupLongitude": 106.7009,
        "pickupAddress": "Saigon Opera House, District 1, HCMC",
        "dropoffLatitude": 10.7725,
        "dropoffLongitude": 106.6980,
        "dropoffAddress": "Ben Thanh Market, District 1, HCMC"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 201 Created", function() {
          expect(res.status).to.equal(201);
        });
        test("Returns immutable quote snapshot", function() {
          expect(res.body).to.have.property("quoteId");
          expect(res.body).to.have.property("customerId");
          expect(res.body.serviceType).to.equal("RIDE");
          expect(res.body.vehicleType).to.equal("MOTORBIKE");
          expect(res.body).to.have.property("totalFare");
          expect(res.body.currency).to.equal("VND");
          expect(res.body.isExpired).to.equal(false);
          expect(res.body).to.have.property("breakdown");
          bru.setEnvVar("quoteId", res.body.quoteId);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
