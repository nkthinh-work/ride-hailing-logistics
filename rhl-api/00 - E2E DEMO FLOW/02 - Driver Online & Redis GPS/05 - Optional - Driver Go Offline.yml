info:
  name: 05 - Optional - Driver Go Offline
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/locations/me/offline"
  auth:
    type: bearer
    token: "{{driverAccessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.status).to.equal(200);
        });
        test("Driver status transitioned to OFFLINE", function() {
          expect(res.body.status).to.equal("OFFLINE");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
