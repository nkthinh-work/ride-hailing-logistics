info:
  name: 01 - Check Driver Eligibility
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/drivers/applications/me/eligibility"
  auth:
    type: bearer
    token: "{{driverAccessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.status).to.equal(200);
        });
        test("Driver is eligible to go online", function() {
          expect(res.body.eligible).to.equal(true);
          expect(res.body.applicationStatus).to.equal("APPROVED");
          expect(res.body.hasDriverRole).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
