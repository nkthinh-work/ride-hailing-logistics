info:
  name: 03 - Update Driver GPS
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/locations/me"
  body:
    type: json
    data: |-
      {
        "longitude": 105.8345,
        "latitude": 21.0280,
        "sequence": 1,
        "sessionId": "{{driverSessionId}}"
      }
  auth:
    type: bearer
    token: "{{driverAccessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.status).to.equal(200);
        });
        test("Driver position updated in Redis GEO", function() {
          expect(res.body.status).to.equal("ONLINE");
          expect(res.body.longitude).to.equal(105.8345);
          expect(res.body.latitude).to.equal(21.028);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
