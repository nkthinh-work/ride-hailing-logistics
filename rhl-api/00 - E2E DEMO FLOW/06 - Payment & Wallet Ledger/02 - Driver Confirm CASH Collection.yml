info:
  name: 02 - Driver Confirm CASH Collection
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/payments/{{paymentId}}/cash/confirm"
  auth:
    type: bearer
    token: "{{driverAccessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.status).to.equal(200);
        });
        test("Cash payment confirmed and finalized", function() {
          expect(res.body.paymentId).to.equal(bru.getEnvVar("paymentId"));
          expect(res.body.status).to.be.oneOf(["SUCCESS", "COMPLETED"]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
