info:
  name: 03 - Get Payment Details
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/payments/{{paymentId}}"
  auth:
    type: bearer
    token: "{{customerAccessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.status).to.equal(200);
        });
        test("Payment record reflects confirmed state", function() {
          expect(res.body.paymentId).to.equal(bru.getEnvVar("paymentId"));
          expect(res.body.tripId).to.equal(bru.getEnvVar("tripId"));
          expect(res.body.method).to.equal("CASH");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
