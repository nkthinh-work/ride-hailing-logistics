info:
  name: 03 - Get Booking Details
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/trips/{{tripId}}"
  auth:
    type: bearer
    token: "{{customerAccessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.status).to.equal(200);
        });
        test("Trip matches current active booking", function() {
          expect(res.body.tripId).to.equal(bru.getEnvVar("tripId"));
          expect(res.body).to.have.property("status");
          expect(res.body).to.have.property("estimatedFare");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
