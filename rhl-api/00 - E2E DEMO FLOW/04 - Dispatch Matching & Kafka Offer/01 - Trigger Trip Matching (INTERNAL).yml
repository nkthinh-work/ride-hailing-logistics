info:
  name: 01 - Trigger Trip Matching (INTERNAL)
  type: http
  seq: 1

http:
  method: POST
  url: "{{tripBaseUrl}}/internal/v1/trips/{{tripId}}/start-matching"
  headers:
    - name: X-Internal-Secret
      value: "{{internalSecret}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.status).to.equal(200);
        });
        test("Trip status transitioned to MATCHING", function() {
          expect(res.body.tripId).to.equal(bru.getEnvVar("tripId"));
          expect(res.body.status).to.equal("MATCHING");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
