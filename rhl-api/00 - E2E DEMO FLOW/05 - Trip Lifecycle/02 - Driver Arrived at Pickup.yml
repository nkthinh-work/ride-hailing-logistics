info:
  name: 02 - Driver Arrived at Pickup
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/trips/{{tripId}}/arrive"
  auth:
    type: bearer
    token: "{{driverAccessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.status).to.equal(200);
        });
        test("Trip status transitioned to ARRIVED", function() {
          expect(res.body.tripId).to.equal(bru.getEnvVar("tripId"));
          expect(res.body.status).to.equal("ARRIVED");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
