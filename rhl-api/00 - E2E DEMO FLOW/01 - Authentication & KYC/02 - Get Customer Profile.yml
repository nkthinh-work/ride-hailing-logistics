info:
  name: 02 - Get Customer Profile
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/auth/me"
  auth:
    type: bearer
    token: "{{customerAccessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body && res.body.userId) {
          bru.setEnvVar("customerUserId", res.body.userId);
        }
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.status).to.equal(200);
        });
        test("User has CUSTOMER role and identity attributes", function() {
          expect(res.body).to.have.property("userId");
          expect(res.body.roles).to.include("CUSTOMER");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
