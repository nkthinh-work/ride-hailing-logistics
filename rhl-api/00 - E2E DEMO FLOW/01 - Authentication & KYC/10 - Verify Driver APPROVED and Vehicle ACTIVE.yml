info:
  name: 10 - Verify Driver APPROVED and Vehicle ACTIVE
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/api/v1/drivers/applications/me/vehicles"
  auth:
    type: bearer
    token: "{{driverAccessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && Array.isArray(res.body) && res.body.length > 0) {
          bru.setEnvVar("vehicleId", res.body[0].id);
        }
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.status).to.equal(200);
        });
        test("Driver has active registered vehicle", function() {
          expect(res.body).to.be.an("array");
          expect(res.body.length).to.be.greaterThan(0);
          expect(res.body[0].status).to.equal("ACTIVE");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
