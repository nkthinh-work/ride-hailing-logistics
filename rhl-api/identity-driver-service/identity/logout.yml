info:
  name: logout
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/logout"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 204 No Content", function() {
          expect(res.status).to.equal(204);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
