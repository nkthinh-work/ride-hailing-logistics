info:
  name: login
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "customer.test@example.com",
        "password": "Password123!"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body && res.body.accessToken) {
          bru.setEnvVar("accessToken", res.body.accessToken);
          bru.setEnvVar("refreshToken", res.body.refreshToken);
        }
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.status).to.equal(200);
        });
        test("Response contains accessToken and refreshToken", function() {
          expect(res.body).to.have.property("accessToken");
          expect(res.body).to.have.property("refreshToken");
          expect(res.body.tokenType).to.equal("Bearer");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
