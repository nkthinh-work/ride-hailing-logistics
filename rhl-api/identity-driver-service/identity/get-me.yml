info:
  name: get-me
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/auth/me"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.status).to.equal(200);
        });
        test("Response contains userId, roles and permissions", function() {
          expect(res.body).to.have.property("userId");
          expect(res.body).to.have.property("roles");
          expect(res.body).to.have.property("permissions");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5