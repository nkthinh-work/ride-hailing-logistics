info:
  name: get-my-vehicles
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/v1/drivers/vehicles/me"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.status).to.equal(200);
        });
        test("Response is an array of vehicles", function() {
          expect(res.body).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
