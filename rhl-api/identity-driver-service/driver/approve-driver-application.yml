info:
  name: approve-driver-application
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/drivers/applications/{{applicationId}}/approve"
  auth:
    type: bearer
    token: "{{reviewerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.status).to.equal(200);
        });
        test("Application status is updated to APPROVED", function() {
          expect(res.body).to.have.property("status");
          expect(res.body.status).to.equal("APPROVED");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
