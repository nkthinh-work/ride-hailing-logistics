info:
  name: get-driver-application
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/drivers/applications/me"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.status).to.equal(200);
        });
        test("Response contains driver application details", function() {
          expect(res.body).to.have.property("id");
          expect(res.body).to.have.property("status");
          expect(res.body).to.have.property("fullName");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5