info:
  name: cancel-trip-customer
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/v1/trips/{{tripId}}/cancel"
  headers:
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{customerAccessToken}}"
  body:
    type: json
    data: |-
      {
        "reasonCode": "CUSTOMER_CHANGE_OF_MIND",
        "description": "Found alternative transport"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.status).to.equal(200);
        });
        test("Trip is marked as CANCELLED", function() {
          expect(res.body.status).to.equal("CANCELLED");
          expect(res.body.cancellationActorRole).to.equal("CUSTOMER");
          expect(res.body.cancellationReason).to.include("CUSTOMER_CHANGE_OF_MIND");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
