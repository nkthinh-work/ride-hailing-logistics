info:
  name: get-trip-location-snapshot
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseUrl}}/api/v1/trips/{{tripId}}/location"
  headers: []
  auth:
    type: bearer
    token: "{{customerAccessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.status).to.equal(200);
        });
        test("Returns location snapshot with availability flag", function() {
          expect(res.body.tripId).to.equal(bru.getEnvVar("tripId"));
          expect(res.body).to.have.property("available");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
