info:
  name: get-trip-by-id
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/trips/{{tripId}}"
  headers: []
  auth:
    type: bearer
    token: "{{customerAccessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.status).to.equal(200);
        });
        test("Returns trip details matching tripId", function() {
          expect(res.body.tripId).to.equal(bru.getEnvVar("tripId"));
          expect(res.body.status).to.equal("CREATED");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
